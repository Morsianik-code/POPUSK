<div class="fog" aria-hidden="true"><i></i><i></i></div>
<div id="eyes" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<div id="bolt" aria-hidden="true"></div>

<main>
  <!-- ИНТРО -->
  <section class="scene" data-scene="intro" inert>
    <div class="float"><div class="tilt">
      <img class="peeker" id="peeker" src="assets/ghost.png" alt="" aria-hidden="true" draggable="false">
      <article class="card glass" id="introCard">
        <span class="web-spider" aria-hidden="true"><i></i><img src="assets/spider.png" alt="" draggable="false"></span>
        <h1 id="hello"></h1>
        <p class="lead" id="introLead"></p>
        <div class="row">
          <button class="btn primary" id="startBtn" type="button"><span id="startLabel"></span><span class="arr">→</span></button>
        </div>
        <button class="sound-btn" id="introSound" type="button" aria-pressed="false">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lbl"></span>
        </button>
      </article>
    </div></div>
  </section>

  <!-- ВОПРОСЫ: две одинаковые карточки по очереди — уходящая и приходящая -->
  <section class="scene" data-scene="quiz" inert>
    <div class="float"><div class="tilt">
      <div class="stack" id="quizStack" aria-live="polite">
        <article class="card glass qcard"></article>
        <article class="card glass qcard is-off" inert></article>
        <i class="pearl" id="pearl" aria-hidden="true"></i>
      </div>
    </div></div>
  </section>

  <!-- РЕЗУЛЬТАТ -->
  <section class="scene" data-scene="result" inert>
    <div class="float"><div class="tilt">
      <article class="card glass" id="resultCard" style="text-align:center">
        <p class="eyebrow" id="resEyebrow"></p>
        <div class="creature" aria-hidden="true">
          <img id="creatureImg" alt="" draggable="false">
          <img id="devil" src="assets/devil.png" alt="" draggable="false">
          <span class="say" id="devilSay"></span>
        </div>
        <div class="num" id="num" role="img"></div>
        <p class="label" id="resLabel"></p>
        <p class="lead" id="resText"></p>
        <button class="btn" id="resBtn" type="button"><span id="resBtnLabel"></span><span class="arr">→</span></button>
      </article>
    </div></div>
  </section>

  <!-- ПИСЬМО-ПРОКЛЯТИЕ на пергаменте -->
  <section class="scene" data-scene="letter" inert>
    <div class="float"><div class="tilt">
      <article class="card letter parchment" id="letterCard">
        <div class="letter-scroll" id="letterScroll">
        <p class="eyebrow" id="letterEyebrow"></p>
        <div id="letterBody"></div>
        <p class="sig" id="sig"><span class="sig-win"><span class="sig-ink" id="sigInk"></span></span></p>
        <p class="ps" id="ps"></p>
        <div class="heartwrap" id="heartwrap">
          <button class="heart-btn" id="heartBtn" type="button" aria-label="Сорвать печать">
            <span class="core"><svg viewBox="0 0 64 64" aria-hidden="true">
              <path class="st" d="M31 17c-1-5 1-9 5-11"/>
              <path class="pb" d="M32 18c-5-3-13-3-18 2-7 7-7 23 1 31 5 5 12 6 17 3 5 3 12 2 17-3 8-8 8-24 1-31-5-5-13-5-18-2z"/>
              <path class="fc" d="M20 32l5-7 5 7zM34 32l5-7 5 7zM18 39c5 8 23 8 28 0l-4 2-3-3-3 4-4-4-4 4-3-4-3 3z"/>
            </svg></span>
          </button>
          <span id="heartHint"></span>
        </div>
        </div>
      </article>
    </div></div>
  </section>

  <!-- ФИНАЛ -->
  <section class="scene" data-scene="finale" inert>
    <div class="finale-shade" id="finaleShade" aria-hidden="true"></div>
    <div class="finale-stage" id="finaleStage">
      <p class="eyebrow" id="finEyebrow"></p>
      <p class="display" id="finTitle"></p>
      <p class="fin-sub" id="finSub"></p>
      <button class="btn primary" id="finBtn" type="button"><span id="finBtnLabel"></span></button>
      <a class="fin-link" id="finLink" href="#"></a>
    </div>
  </section>
</main>

<!-- слой «пугалок»: летучие мыши, привидения, паук, кот, конфеты -->
<div id="scare" aria-hidden="true"></div>
<!-- «кто выключил свет»: темнота с фонариком -->
<div id="dark" aria-hidden="true"></div>
<!-- главный скример -->
<div id="boo" aria-hidden="true">
  <div class="boo-bg"></div>
  <img class="boo-ghost" src="assets/ghost.svg" alt="" draggable="false">
  <p class="boo-text">БУ!</p>
</div>
<div id="toast" role="status"><img src="assets/scream.png" alt="" draggable="false"><span></span></div>
<button id="snd" type="button" aria-label="Звук" aria-pressed="true">
  <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/><path class="wv" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
  <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/><path class="wv" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<noscript><div>Для этой страницы нужен JavaScript — включи его, пожалуйста, и обнови страницу.</div></noscript>

<!-- ============================================================
     НАСТРОЙКИ. Всё, что нужно менять под себя, — здесь.
     {name} в текстах заменяется на имя.
     ============================================================ -->
<script>
window.CONFIG = {
  name: "Ксюня",          // её имя. Пустая строка — обращение без имени
  replyUrl: "",           // ссылка «написать мне» под кнопкой в финале, например "https://t.me/username". Пусто — «пройти ещё раз»
  sound: true,            // звук по умолчанию (переключатель — справа вверху)
  scares: true,           // false — без скримеров (останутся молнии и темнота)

  intro: {
    title:  "Сладость или гадость, <em>{name}?</em>",
    lead:   "Этой ночью граница между мирами тоньше паутинки. Ответь на <strong>10 вопросов</strong> — и я узнаю, какая нечисть живёт у тебя внутри. Если станет страшно, держись за экран.",
    button: "Войти, если не страшно",
    soundOff: "Включить звук — так страшнее",   // кнопка под «Войти»: звук ещё не играет
    soundOn:  "Звук включён",                   // музыка уже играет (нажатие выключит)
  },

  quiz: {
    eyebrow: "вопрос {n}",
    // Переходы между вопросами по кругу: flicker (карточка мигает, как лампочка в подвале), flip, cube, jelly,
    // toss, zoom, orbit, drop, pearl (огонёк), hinge
    transitions: ["flicker", "flip", "cube", "jelly", "toss", "pearl", "drop", "orbit", "hinge"],
    // is — какая нечисть стоит за ответом: pumpkin, ghost, vampire, witch.
    // onEnter — пугалка, когда вопрос появился; onAnswer — после ответа.
    // Пугалки: bats, peek (привидение выглядывает), spider, cat, lightning, dark (гаснет свет), boo (скример), knock (стук в дверь)
    questions: [
      {
        title: "Полночь. Под кроватью что-то шуршит. Твои действия?",
        options: [
          { text: "Накроюсь одеялом с головой: одеяло спасает от всего", is: "pumpkin" },
          { text: "Шепну: «Ты тоже не спишь?»", is: "ghost" },
          { text: "Посмотрю туда так, что оно само уйдёт", is: "vampire" },
          { text: "Предложу ему чай и выведаю все тайны", is: "witch" },
        ],
      },
      {
        title: "Тебя позвали на бал нечисти. В чём пойдёшь?",
        options: [
          { text: "Чёрный бархат, красная помада и много драмы", is: "vampire" },
          { text: "Остроконечная шляпа и кот на плече", is: "witch" },
          { text: "Костюм тыквы: мягко, тепло и карманы для конфет", is: "pumpkin" },
          { text: "Простыня с дырками. Классика вечна", is: "ghost" },
        ],
        onAnswer: "bats",
      },
      {
        title: "Что ты сваришь в своём котле?",
        options: [
          { text: "Немного тумана и лунного света", is: "ghost" },
          { text: "Какао с зефирками. Котёл огромный", is: "pumpkin" },
          { text: "Всё подряд, а потом посмотрим, что взорвётся", is: "witch" },
          { text: "Что-то красное. Это вишнёвый сок. Наверное", is: "vampire" },
        ],
      },
      {
        title: "Твоё любимое время суток?",
        options: [
          { text: "Вечер: на улице темно, а дома тепло", is: "pumpkin" },
          { text: "Полночь. Самое время выйти в свет", is: "vampire" },
          { text: "Три часа ночи, когда все спят и можно бродить", is: "ghost" },
          { text: "Полнолуние. Время неважно, главное — луна", is: "witch" },
        ],
        onEnter: "peek",
      },
      {
        title: "Кто живёт с тобой в твоём замке?",
        options: [
          { text: "Чёрный кот, который всё понимает", is: "witch" },
          { text: "Никто. Хотя стулья иногда двигаются сами", is: "ghost" },
          { text: "Толстый хомяк, который ест больше меня", is: "pumpkin" },
          { text: "Летучая мышь по имени Граф", is: "vampire" },
        ],
        onEnter: "lightning",
      },
      {
        eyebrow: "ой… кто выключил свет? · {light}",
        title: "Темно, хоть глаз выколи. Что будешь делать?",
        options: [
          { text: "Найду плед и подожду, пока само включится", is: "pumpkin" },
          { text: "Наконец-то. Глазам больше не больно", is: "vampire" },
          { text: "Щёлкну пальцами — и будет свет", is: "witch" },
          { text: "Ничего. В темноте я как дома", is: "ghost" },
        ],
        onEnter: "dark",
      },
      {
        title: "Чего ты боишься на самом деле?",
        options: [
          { text: "Что закончится какао", is: "pumpkin" },
          { text: "Тишины в три часа ночи", is: "ghost" },
          { text: "Солнца. И понедельников", is: "vampire" },
          { text: "Ничего не боюсь", is: "witch" },
        ],
        // этот ответ «передумывает», если на него навести или нажать
        trick: { option: 3, text: "Ничего не боюсь… кроме пауков 🕷" },
        onEnter: "spider",
      },
      {
        title: "Стучат в дверь: «Сладость или гадость!» Что сделаешь?",
        onEnter: "knock",
        options: [
          { text: "Отдам все конфеты и ещё испеку пирог", is: "pumpkin" },
          { text: "Превращу всех в лягушек. Милых, с бантиками", is: "witch" },
          { text: "Тихо открою… а за дверью уже никого", is: "ghost" },
          { text: "Выберу гадость. Но очень стильную", is: "vampire" },
        ],
        onAnswer: "boo",
      },
      {
        title: "Выбери заклинание",
        options: [
          { text: "Чтобы никогда-никогда не стареть", is: "vampire" },
          { text: "Чтобы всем вокруг всегда было тепло", is: "pumpkin" },
          { text: "Чтобы проходить сквозь стены. И дедлайны", is: "ghost" },
          { text: "Чтобы любое желание сбывалось с первого раза", is: "witch" },
        ],
        onEnter: "cat",
      },
      {
        title: "Последний. Как думаешь, зачем я сделал этот сайт?",
        options: [
          { text: "Чтобы меня напугать", is: "vampire" },
          { text: "Чтобы узнать, какая я нечисть", is: "witch" },
          { text: "Потому что Хэллоуин — лучший праздник", is: "pumpkin" },
          { text: "Ты что-то задумал…", is: "ghost" },
        ],
        onEnter: "peek",
        onAnswer: "bats",
      },
    ],
  },
